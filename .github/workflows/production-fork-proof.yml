name: production fork proof

on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: Archive-capable Ethereum mainnet RPC used read-only
        required: true
        default: https://mainnet.gateway.tenderly.co
        type: string

permissions:
  contents: read

concurrency:
  group: production-fork-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  no-mock-mainnet-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ETH_RPC_URL: ${{ inputs.rpc_url }}
    steps:
      - name: Checkout with pinned dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: v1.7.1

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Install locked quote-desk dependencies
        run: npm --prefix services/quote-signer ci

      - name: Prove chain and historical-state access
        run: |
          test "$(cast chain-id --rpc-url "$ETH_RPC_URL")" = "1"
          cast call \
            0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2 \
            "totalSupply()(uint256)" \
            --block 25604561 \
            --rpc-url "$ETH_RPC_URL"

      - name: Run all production-contract fork tests
        run: make test-fork

      - name: Run exact deploy, quote, approve, and fill rehearsal
        run: make live-product-e2e

      - name: Run existing-unstETH firm-offer, approval, and sale rehearsal
        run: make existing-unsteth-e2e

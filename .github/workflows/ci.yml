name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with pinned dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: v1.7.1

      - name: Build
        run: forge build

      - name: Check formatting
        run: forge fmt --check

      - name: Lint Solidity
        run: forge lint

      - name: Run deterministic local suite
        env:
          FOUNDRY_PROFILE: ci
        run: >-
          forge test
          --no-match-path "test/fork/*"
          --fuzz-seed 0x5245534552564f4952

      - name: Run judge demo
        run: make demo

      - name: Run Reservoir v2 judge demo
        run: make demo-v2

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/quote-signer/package-lock.json

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Install and test the production quote signer
        run: |
          npm --prefix services/quote-signer ci
          npm --prefix services/quote-signer test

      - name: Run frontend build, lint, and truthfulness tests
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build:vercel
